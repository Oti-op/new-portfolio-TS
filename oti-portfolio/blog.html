<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Oti Oseji</title>
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'system';
      var pd = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'dark' || (t === 'system' && pd)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <script>tailwind = { config: { darkMode: 'class' } }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-font-smoothing: antialiased; }

    .fade-section {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-section.show {
      opacity: 1;
      transform: translateY(0);
    }

    .theme-btn-active {
      background-color: rgba(0, 0, 0, 0.08);
    }
    html.dark .theme-btn-active {
      background-color: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-white dark:bg-[#111] text-neutral-900 dark:text-neutral-100 min-h-screen">

  <div id="top" class="max-w-[640px] mx-auto px-5 py-12">

    <!-- Avatar -->
    <div class="mb-8 fade-section">
      <img src="assets/images/avatar.jpg" alt="Oti Oseji" class="w-32 h-32 rounded-lg object-cover object-top border border-black/15 dark:border-white/20" />
    </div>

    <!-- Header -->
    <header class="flex items-center justify-between mb-16 fade-section">
      <a href="index.html" class="font-semibold text-sm underline underline-offset-[3px] decoration-black/40 dark:decoration-white/40 hover:decoration-black dark:hover:decoration-white transition-all">
        Oti Oseji
      </a>
      <nav class="flex items-center gap-1.5 text-sm">
        <a href="index.html" class="text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">about</a>
        <span class="text-neutral-300 dark:text-neutral-600">/</span>
        <a href="projects.html" class="text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">projects</a>
        <span class="text-neutral-300 dark:text-neutral-600">/</span>
        <a href="blog.html" class="underline underline-offset-[3px] decoration-[1.5px] font-medium">blog</a>
        <span class="text-neutral-300 dark:text-neutral-600">/</span>
        <a href="cv.html" class="text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">cv</a>
      </nav>
    </header>

    <!-- Main -->
    <main>

      <section class="mb-12 fade-section">
        <h1 class="text-2xl font-semibold mb-3">Blog</h1>
        <p class="text-sm text-neutral-600 dark:text-neutral-400 leading-relaxed">
          Writing about tech, projects, and things I'm learning.
        </p>
      </section>

      <!-- Empty state -->
      <section class="fade-section">
        <div class="border border-black/12 dark:border-white/[0.12] rounded-lg px-5 py-10 text-center">
          <p class="text-sm text-neutral-400 dark:text-neutral-500">
            No posts yet &mdash; check back soon.
          </p>
        </div>
      </section>

    </main>

    <!-- Back to top -->
    <div class="flex justify-end mt-16 mb-5 fade-section">
      <a href="#top" class="text-xs text-neutral-400 dark:text-neutral-500 underline underline-offset-[3px] hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">
        Back to top ↑
      </a>
    </div>

    <!-- Footer -->
    <footer class="flex items-center justify-between pt-4 border-t border-black/10 dark:border-white/[0.08] fade-section">
      <p class="text-xs text-neutral-400 dark:text-neutral-500">
        &copy; Oti Oseji &middot; Last updated May 2025
      </p>
      <div class="flex items-center gap-1">
        <button id="btn-light" onclick="setTheme('light')" title="Light mode"
          class="w-7 h-7 rounded border border-black/12 dark:border-white/[0.12] text-[11px] hover:bg-black/5 dark:hover:bg-white/5 transition-colors flex items-center justify-center leading-none">
          ☀
        </button>
        <button id="btn-system" onclick="setTheme('system')" title="System default"
          class="w-7 h-7 rounded border border-black/12 dark:border-white/[0.12] text-[11px] hover:bg-black/5 dark:hover:bg-white/5 transition-colors flex items-center justify-center leading-none">
          ◑
        </button>
        <button id="btn-dark" onclick="setTheme('dark')" title="Dark mode"
          class="w-7 h-7 rounded border border-black/12 dark:border-white/[0.12] text-[11px] hover:bg-black/5 dark:hover:bg-white/5 transition-colors flex items-center justify-center leading-none">
          ☾
        </button>
      </div>
    </footer>

  </div>

  <script>
    function setTheme(t) {
      localStorage.setItem('theme', t);
      var pd = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'dark' || (t === 'system' && pd)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeButtons(t);
    }

    function updateThemeButtons(t) {
      ['light', 'system', 'dark'].forEach(function (id) {
        var btn = document.getElementById('btn-' + id);
        if (btn) btn.classList.toggle('theme-btn-active', id === t);
      });
    }

    updateThemeButtons(localStorage.getItem('theme') || 'system');

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.fade-section').forEach(function (el, i) {
        setTimeout(function () { el.classList.add('show'); }, i * 100);
      });
    });
  </script>
</body>
</html>
